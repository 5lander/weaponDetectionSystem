# Weapon Detection System v2.1 - Configuración Principal
# Este archivo se genera automáticamente durante el setup

[General]
version=2.1.0
debug_mode=false
log_level=INFO
auto_start_camera=true

[Detection]
analysis_interval=3
confidence_threshold=0.5
capture_interval=5
max_detections_per_session=100

[Camera]
default_resolution_width=640
default_resolution_height=480
fps_target=30
buffer_size=1

[Network]
server_timeout=30
retry_attempts=3
connection_timeout=10

[UI]
theme=dark
language=es
show_fps=true
show_resource_monitor=true

[Logging]
max_log_size_mb=50
log_rotation_count=5
log_to_console=true
log_to_file=true
