# Weapon Detection System v2.1 - Configuracion Principal
# ---------------------------------------------------------------------------
# Este archivo SI se lee al arrancar: App/cameras_config.py lo carga y con el
# sobrescribe los valores por defecto de GLOBAL_CONFIG. Solo se aplican las
# claves presentes; si el archivo falta o una clave esta mal escrita, se
# conserva el valor por defecto del codigo.
# Los valores de abajo son los efectivos hoy: editarlos cambia el
# comportamiento sin recompilar.
# ---------------------------------------------------------------------------

[General]
version=2.1.0
debug_mode=false
log_level=INFO
auto_start_camera=true

[Detection]
# Segundos entre analisis por camara (se muestran todos los frames, pero solo
# se envia uno al motor cada este intervalo).
analysis_interval=2
# Umbral de confianza EFECTIVO (este archivo manda sobre el default del
# codigo). Medido con lastv2.pt: arma quieta 0.67-0.91, arma en movimiento
# baja de 0.70, falso positivo tipico <=0.43.
# 0.60: elegido para demostracion en vivo. 0.70 daba maxima precision pero
# perdia el arma en movimiento (y con confirmacion 2 de 4 hacen falta ~8 s de
# deteccion sostenida para alertar). 0.60 recupera frames con desenfoque sin
# acercarse al 0.43 del falso positivo, que ademas la confirmacion filtra.
confidence_threshold=0.60
# Segundos minimos entre una captura/subida y la siguiente.
capture_interval=4
# Maximo de detecciones que devuelve el modelo por frame.
max_detections=10
# Confirmacion temporal "N de las ultimas M" antes de alertar.
confirmation_frames=2
confirmation_window=4
# VENTANA DE TAMANO DE CAJA (fraccion del area del frame). Estos son los valores
# POR DEFECTO; cada camara puede sobrescribirlos con su escenario (clave "scene"
# en cameras.json, editable desde el gestor de camaras: Primer plano / Interior /
# Exterior). La escala depende de la geometria: en una webcam a 1 m un cuchillo
# ocupa 3%-25% del encuadre, y en una camara de calle a 12 m un arma ocuparia
# ~0.03%, mientras que un AUTO ocupa 8%-14%.
# Area minima: filtra ruido de pocos pixeles.
min_box_area_ratio=0.003
# Area maxima: descarta lo demasiado grande para ser un arma. Medido con falsos
# positivos reales de una camara de calle, donde el modelo daba 'Knife' 0.86 y
# 'Pistol' 0.80 sobre autos enteros. El umbral de confianza NO los separa (superan
# a las armas reales, 0.63-0.79); el tamano si.
max_box_area_ratio=0.60
# Workers de inferencia (1 modelo en RAM para todas las camaras).
inference_workers=1

[Camera]
default_resolution_width=640
default_resolution_height=480
cameras_per_row=2
buffer_size=1

[Network]
server_url=https://weaponnotificationserver.onrender.com/api/images/
max_reconnect_attempts=3
reconnect_delay=2

[UI]
theme=dark
language=es
show_fps=true
show_resource_monitor=true

[Logging]
max_log_size_mb=50
log_rotation_count=5
log_to_console=true
log_to_file=true
