# Logging Configuration for Weapon Detection System
# Format: timestamp - level - message

[loggers]
keys=root,weapon_detection

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=detailedFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_weapon_detection]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=weapon_detection
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=detailedFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=detailedFormatter
args=('logs/weapon_detection.log', 'a', 52428800, 5, 'utf-8')

[formatter_detailedFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
